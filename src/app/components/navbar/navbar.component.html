<header class="sticky top-0 z-50 w-full backdrop-blur-xl bg-slate-950/70 border-b border-white/5 shadow-lg shadow-black/20 transition-all duration-300 supports-[backdrop-filter]:bg-slate-950/60">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <a href="#home" (click)="scrollToSection($event, '#home')" class="flex items-center gap-2.5 group">
        <div class="relative w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white font-extrabold text-sm tracking-tight shadow-lg shadow-cyan-500/25 group-hover:scale-105 group-hover:shadow-cyan-500/40 group-hover:rotate-3 transition-all duration-300">
          <span class="group-hover:opacity-0 transition-opacity duration-200">M</span>
          <span class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-200 text-cyan-300">&gt;_</span>
        </div>
        <div class="flex flex-col">
          <span class="font-bold text-lg bg-gradient-to-r from-slate-100 via-slate-200 to-slate-400 bg-clip-text text-transparent group-hover:from-cyan-400 group-hover:to-blue-400 transition-all">
            Manuel Alba
          </span>
          <span class="text-[10px] text-cyan-400 tracking-wider font-semibold uppercase -mt-1">
            {{ data().navbar.brandTagline }}
          </span>
        </div>
      </a>

      <nav class="hidden md:flex items-center space-x-1 lg:space-x-2">
        @for (item of data().navbar.navItems; track item.href) {
          <a
            [href]="item.href"
            (click)="scrollToSection($event, item.href)"
            [class]="isActive(item.href)
              ? 'relative px-3.5 py-2 rounded-lg text-sm font-medium text-cyan-400 bg-slate-900/70 shadow-sm transition-all duration-200'
              : 'relative px-3.5 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-cyan-400 hover:bg-slate-900/60 transition-all duration-200'"
          >
            {{ item.label }}
            <span
              class="absolute bottom-0.5 left-1/2 -translate-x-1/2 h-0.5 rounded-full bg-gradient-to-r from-cyan-500 to-blue-500 transition-all duration-300"
              [class]="isActive(item.href) ? 'absolute bottom-0.5 left-1/2 -translate-x-1/2 h-0.5 w-6 rounded-full bg-gradient-to-r from-cyan-500 to-blue-500 transition-all duration-300' : 'absolute bottom-0.5 left-1/2 -translate-x-1/2 h-0.5 w-0 rounded-full bg-gradient-to-r from-cyan-500 to-blue-500 transition-all duration-300'"
            ></span>
          </a>
        }
      </nav>

      <div class="hidden md:flex items-center gap-3">
        <div class="flex items-center gap-1 rounded-lg bg-slate-900 border border-slate-800 p-0.5">
          <button
            type="button"
            (click)="setLanguage('en')"
            [attr.aria-label]="'Switch to English'"
            class="lang-btn"
            [class.active]="currentLang === 'en'"
          >
            <svg class="w-5 h-5 rounded-sm" viewBox="0 0 24 16" xmlns="http://www.w3.org/2000/svg">
              <rect width="24" height="16" fill="#B22234"/>
              <g fill="#fff"><rect y="1.8" width="24" height="1.3"/><rect y="4.5" width="24" height="1.3"/><rect y="7.2" width="24" height="1.3"/><rect y="9.9" width="24" height="1.3"/><rect y="12.6" width="24" height="1.3"/></g>
              <rect width="10.5" height="8" fill="#3C3B6E"/>
              <g fill="#fff"><circle cx="2" cy="2" r="0.7"/><circle cx="4.5" cy="2" r="0.7"/><circle cx="7" cy="2" r="0.7"/><circle cx="3.2" cy="3.6" r="0.7"/><circle cx="5.8" cy="3.6" r="0.7"/><circle cx="2" cy="5.2" r="0.7"/><circle cx="4.5" cy="5.2" r="0.7"/><circle cx="7" cy="5.2" r="0.7"/><circle cx="3.2" cy="6.8" r="0.7"/><circle cx="5.8" cy="6.8" r="0.7"/></g>
            </svg>
          </button>
          <button
            type="button"
            (click)="setLanguage('es')"
            [attr.aria-label]="'Cambiar a Español'"
            class="lang-btn"
            [class.active]="currentLang === 'es'"
          >
            <svg class="w-5 h-5 rounded-sm" viewBox="0 0 24 16" xmlns="http://www.w3.org/2000/svg">
              <rect width="24" height="16" fill="#AA151B"/>
              <rect y="4" width="24" height="8" fill="#F1BF00"/>
              <rect x="5" y="6" width="3" height="4" rx="0.5" fill="#AA151B" opacity="0.85"/>
            </svg>
          </button>
        </div>
        <a
          href="#contact"
          class="relative inline-flex items-center justify-center p-0.5 overflow-hidden text-xs font-semibold rounded-xl group bg-gradient-to-br from-cyan-500 to-blue-600 text-white shadow-md shadow-cyan-500/10 hover:shadow-cyan-500/25 transition-all"
        >
          <span class="relative px-4 py-2 rounded-[10px] bg-slate-950 group-hover:bg-opacity-0 flex items-center gap-2">
            <span>{{ data().navbar.cta }}</span>
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </span>
        </a>
      </div>

      <div class="flex md:hidden items-center gap-2">
        <div class="flex items-center gap-1 rounded-lg bg-slate-900 border border-slate-800 p-0.5">
          <button
            type="button"
            (click)="setLanguage('en')"
            [attr.aria-label]="'Switch to English'"
            class="lang-btn"
            [class.active]="currentLang === 'en'"
          >
            <svg class="w-5 h-5 rounded-sm" viewBox="0 0 24 16" xmlns="http://www.w3.org/2000/svg">
              <rect width="24" height="16" fill="#B22234"/>
              <g fill="#fff"><rect y="1.8" width="24" height="1.3"/><rect y="4.5" width="24" height="1.3"/><rect y="7.2" width="24" height="1.3"/><rect y="9.9" width="24" height="1.3"/><rect y="12.6" width="24" height="1.3"/></g>
              <rect width="10.5" height="8" fill="#3C3B6E"/>
              <g fill="#fff"><circle cx="2" cy="2" r="0.7"/><circle cx="4.5" cy="2" r="0.7"/><circle cx="7" cy="2" r="0.7"/><circle cx="3.2" cy="3.6" r="0.7"/><circle cx="5.8" cy="3.6" r="0.7"/><circle cx="2" cy="5.2" r="0.7"/><circle cx="4.5" cy="5.2" r="0.7"/><circle cx="7" cy="5.2" r="0.7"/><circle cx="3.2" cy="6.8" r="0.7"/><circle cx="5.8" cy="6.8" r="0.7"/></g>
            </svg>
          </button>
          <button
            type="button"
            (click)="setLanguage('es')"
            [attr.aria-label]="'Cambiar a Español'"
            class="lang-btn"
            [class.active]="currentLang === 'es'"
          >
            <svg class="w-5 h-5 rounded-sm" viewBox="0 0 24 16" xmlns="http://www.w3.org/2000/svg">
              <rect width="24" height="16" fill="#AA151B"/>
              <rect y="4" width="24" height="8" fill="#F1BF00"/>
              <rect x="5" y="6" width="3" height="4" rx="0.5" fill="#AA151B" opacity="0.85"/>
            </svg>
          </button>
        </div>
        <button
          type="button"
          (click)="toggleMenu()"
          class="inline-flex items-center justify-center p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-cyan-500"
          [attr.aria-expanded]="isMenuOpen()"
          [attr.aria-label]="isMenuOpen() ? data().navbar.closeAria : data().navbar.toggleAria"
        >
          @if (!isMenuOpen()) {
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          } @else {
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          }
        </button>
      </div>
    </div>
  </div>

  @if (isMenuOpen()) {
    <div class="md:hidden border-b border-slate-800 bg-slate-950/95 backdrop-blur-lg px-4 pt-2 pb-4 space-y-1">
      @for (item of data().navbar.navItems; track item.href) {
        <a
          [href]="item.href"
          (click)="scrollToSection($event, item.href)"
          class="block px-3 py-2.5 rounded-lg text-base font-medium transition-colors"
          [class.text-cyan-400]="isActive(item.href)"
          [class.bg-slate-900]="isActive(item.href)"
          [class.text-slate-300]="!isActive(item.href)"
          [class.hover:text-cyan-400]="!isActive(item.href)"
          [class.hover:bg-slate-900]="!isActive(item.href)"
        >
          {{ item.label }}
        </a>
      }
      <div class="pt-3">
        <a
          href="#contact"
          (click)="closeMenu()"
          class="block w-full text-center py-2.5 px-4 rounded-xl font-semibold text-white bg-gradient-to-r from-cyan-500 to-blue-600 shadow-md shadow-cyan-500/20"
        >
          {{ data().navbar.cta }}
        </a>
      </div>
    </div>
  }
</header>
